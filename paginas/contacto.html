<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta a ComfyCat para encontrar el espacio ideal para tu gato.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="icon" type="image/png" href="../img/patita-cursor.png">
    <title>Contacto | ComfyCat</title>
    <script type="module" src="../js/main.js"></script>
</head>

<body data-base="../" data-pagina="contacto">
    <div id="componente-navbar"></div>
    <main>
        <section id="formulario">
            <h1>Contáctanos</h1>
            <p>Cuéntanos qué necesita tu gato y te ayudaremos a encontrar su espacio ideal.</p>

            <form id="form-contacto">
                <p class="form-ayuda" id="form-ayuda">Completa los campos para preparar tu consulta. Tú decides cuándo enviarla por WhatsApp.</p>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="100" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" autocomplete="email" maxlength="200" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" maxlength="2000" placeholder="¿Qué espacio tienes y qué le gusta hacer a tu gato?" required></textarea>

                <button class="boton" type="submit">Preparar consulta</button>
                <p id="estado-consulta" class="form-estado" role="status"></p>
                <a id="continuar-whatsapp" class="form-continuar" target="_blank" rel="noopener noreferrer" hidden>Continuar en WhatsApp ↗</a>

            </form>

        </section>
    </main>
    <div id="componente-footer"></div>
    <div id="componente-boton"></div>
</body>

</html>
