<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce ComfyCat y los beneficios de nuestros muebles para gatos.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <title>Nosotros | ComfyCat</title>
    <script src="../js/componentes.js" defer></script>
</head>

<body data-base="../">
    <div id="componente-navbar"></div>
    <main>
        <section id="nosotros">
            <div class="carrusel">
                <div class="carrusel-pista">
                    <img src="../img/carrusel/cadena-hex-portada.png" alt="Circuito de repisas hexagonales en la pared">
                    <img src="../img/carrusel/cadena-hex-2.png" alt="Gato descansando en una repisa hexagonal">
                    <img src="../img/carrusel/cadena-hex-3.png" alt="Cadena de hexágonos instalada en la pared">
                    <img src="../img/carrusel/repisas.png" alt="Repisas de madera para gatos">
                    <img src="../img/carrusel/mueble-sala.png" alt="Mueble para gatos integrado a la sala">
                    <img src="../img/carrusel/rascador-piso.png" alt="Rascador de piso para gatos">
                    <img src="../img/carrusel/rascador-piso-2.png" alt="Rascador de piso con plataforma">
                    <img src="../img/carrusel/rascador-piso-3.png" alt="Rascador de piso de varios niveles">
                    <!-- Copia de la primera: permite que el giro vuelva al inicio sin salto -->
                    <img src="img/carrusel/cadena-hex-portada.png" alt="" aria-hidden="true">
                </div>
            </div>

            <div class="nosotros-texto">
                <h2>¿Quiénes somos?</h2>
                
                <p>
                    En ComfyCat ofrecemos muebles diseñados para
                    brindar comodidad, diversión y bienestar a los gatos.
                </p>
            </div>

        </section>

        <section id="beneficios">
            <h2>¿Por qué elegir ComfyCat?</h2>

            <ul>
                <li>Espacios para jugar y explorar.</li>
                <li>Lugares cómodos para descansar.</li>
                <li>Diseños pensados para los gatos.</li>
                <li>Ambientes que estimulan su actividad.</li>
            </ul>
        </section>
    </main>
    <div id="componente-footer"></div>
    <div id="componente-boton"></div>
</body>

</html>
